services:
  game-server:
    build:
      context: .
      target: server
    ports:
      - "4010:4010"
    environment:
      NODE_ENV: production
      GAME_SERVER_PORT: 4010
      GAME_SERVER_HOST: 0.0.0.0
      CORS_ORIGINS: http://localhost:8080
      GAME_TICKET_SECRET: ${GAME_TICKET_SECRET:-change-me-compose-ticket-secret-32}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-compose-session-secret-32}
      KV_PERSIST_DIR: /app/.data/matches
    volumes:
      - kv_match_data:/app/.data/matches
    depends_on:
      - db

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - game-server

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kv
      POSTGRES_PASSWORD: kv
      POSTGRES_DB: kimiyaye_vahsh
    ports:
      - "5432:5432"
    volumes:
      - kv_pg:/var/lib/postgresql/data
      - ./packages/game-server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  kv_match_data:
  kv_pg:
